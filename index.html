<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f1e8;
  --card:#fffaf5;
  --accent:#8b5e3c;
  --accent-light:#c9a77b;
  --text:#2b2318;
  --muted:#7a6a55;
  --shadow:rgba(18,12,8,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter",sans-serif;
  background:#f3e6d6;
  color:var(--text);
  padding:16px;
  scroll-behavior:smooth;
}

header, .tabs, main, footer{
  max-width:1100px;
  margin-left:auto;
  margin-right:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:60px;height:60px;
  border-radius:50%;
  background:url('https://i.ibb.co.com/PqqVYdK/almaz.jpg') center/cover no-repeat;
  box-shadow:0 6px 18px var(--shadow);
}
h1{font-size:20px;}
.brand p{font-size:13px;color:var(--muted)}
.btn{
  background:var(--accent);
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 16px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  transition:.15s;
}
.btn:active{transform:scale(0.97);}
.btn.ghost{
  background:transparent;
  border:1px solid rgba(43,35,26,0.1);
  color:var(--accent);
}

/* --- ТАБЫ --- */
.tabs{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 4px 14px;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  white-space:nowrap;
}

.tab{
  padding:10px 16px;
  border-radius:10px;
  background:var(--card);
  border:1px solid rgba(43,35,26,0.1);
  cursor:pointer;
  font-weight:600;
  font-size:15px;
  box-shadow:0 2px 6px var(--shadow);
  transition:.2s;
  text-align:center;
}
.tab:active{transform:scale(0.95);}
.tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent-light);
}
@media(max-width:600px){
  .tabs{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .tab{
    text-align:center;
    font-size:13px;
    padding:10px 6px;
    border-radius:12px;
  }
}

/* --- БЛЮДА --- */
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:16px;
  margin-bottom:60px;
}
.dish{
  background:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}


.dish:hover{transform:translateY(-3px);}
.dish h3{
  font-size:18px;
  font-weight:800;
  margin-bottom:6px;
}

.dish p{
  font-size:14px;
  line-height:1.4;
}

.price{
  font-size:20px;
  font-weight:900;
  color:#8b5e3c;
  margin:10px 0;
}


.add-btn{width:100%;}

/* --- FLOAT CART --- */
#floatCart{
  position:fixed;
  bottom:22px;
  right:22px;
  background:linear-gradient(135deg,var(--accent),#a8724a); 
  color:white;
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  cursor:pointer;
  font-weight:800;
  font-size:26px;
  z-index:999;
  transition:transform .2s ease;
}
#floatCart:hover{transform:scale(1.08);}
#floatCart span{
  position:absolute;
  top:10px;
  right:12px;
  background:#fff;
  color:var(--accent);
  border-radius:50%;
  width:25px;
  height:25px;
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* --- CART MODAL --- */
#cartModal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  display:none;align-items:center;justify-content:center;
  z-index:1000;
}
.cart-box{
  backdrop-filter: blur(6px);

  background:var(--card);
  border-radius:16px;
  padding:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 24px rgba(0,0,0,0.1);
  max-height:90%;
  overflow:auto;
}
.cart-box h3{margin-bottom:10px;text-align:center;}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{border:1px solid rgba(43,35,26,0.1);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;}
.total{
  display:flex;justify-content:space-between;margin-top:8px;
  font-weight:800;border-top:1px dashed rgba(43,35,26,0.1);
  padding-top:8px;
}
form{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
input,textarea{
  border:1px solid rgba(43,35,26,0.1);
  border-radius:10px;
  padding:10px;
  font-size:14px;
  background:transparent;
}
textarea{min-height:60px;resize:vertical;}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px;}

/* --- УВЕДОМЛЕНИЕ --- */
#addedNotify{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:white;
  padding:10px 22px;
  border-radius:12px;
  font-weight:600;
  opacity:0;
  transition:opacity .3s ease;
  z-index:2000;
}
#addedNotify.show{opacity:1;}

.add-btn{
  width:100%;
  padding:14px;
  font-size:16px;
  font-weight:800;
  border-radius:16px;
  background:linear-gradient(135deg,#8b5e3c,#b37b4d);
  box-shadow:0 8px 20px rgba(139,94,60,.4);
}


.add-btn:hover{
  filter:brightness(1.05);
}

header{
  margin-bottom:28px;
}

</style>



</head>

  {name:"Coca-Cola / Pepsi - 1л", price:1100},
  {name:"Вода «Tassay» -1л", price:600},
  {name:"Вода «Asu» - 1л", price:600},
  {name:"Мохито", price:1200},
  {name:"Компот", price:1000},
  {name:"Цитрусовый", price:1200}
]

};

let currentCategory = Object.keys(categories)[0];
let cart = [];

let containerQty = 0;
const CONTAINER_PRICE = 150;


const el = s => document.querySelector(s);
const fmt = v => v.toLocaleString('ru-RU') + " ₸";

function renderTabs(){
  const tabs = el("#tabs");
  tabs.innerHTML = "";
  Object.keys(categories).forEach(cat=>{
    const div = document.createElement("div");
    div.className = "tab" + (cat===currentCategory ? " active" : "");
    div.textContent = cat;
    div.onclick = ()=>{currentCategory=cat;renderTabs();renderMenu();};
    tabs.appendChild(div);
  });
}

function renderMenu(){
  const menu = el("#menu");
  menu.innerHTML = "";
  categories[currentCategory].forEach((p,i)=>{
    menu.innerHTML += `
      <div class="dish">
        <h3>${p.name}</h3>
        ${p.desc?`<p>${p.desc}</p>`:""}
        <div class="price">${fmt(p.price)}</div>
        <button class="btn add-btn" onclick="addToCart('${currentCategory}_${i}')">Добавить</button>
      </div>`;
  });
}

function addToCart(id){
  const [cat,i] = id.split("_");
  const p = categories[cat][i];
  const ex = cart.find(x=>x.name===p.name);
  if(ex) ex.q++;
  else cart.push({...p,q:1});
  updateCart();
}

function changeQty(name,d){
  const it = cart.find(x=>x.name===name);
  if(!it)return;
  it.q+=d;
  if(it.q<1)cart=cart.filter(x=>x.name!==name);
  updateCart();
}

function updateCart(){
  el("#cartCount").textContent = cart.reduce((s,x)=>s+x.q,0);
  const l = el("#cartList");
  if(cart.length===0){l.innerHTML="<p style='color:var(--muted);text-align:center'>Корзина пуста</p>";}
  else{
    l.innerHTML = cart.map(it=>`
      <div class="cart-item">
        <div>${it.name}<br><small>${fmt(it.price)}</small></div>
        <div class="qty">
          <button onclick="changeQty('${it.name}',-1)">-</button>
          <div>${it.q}</div>
          <button onclick="changeQty('${it.name}',1)">+</button>
        </div>
      </div>`).join('');
  }
  const foodTotal = cart.reduce((s,x)=>s+x.price*x.q,0);
const containerTotal = containerQty * CONTAINER_PRICE;
el("#cartTotal").textContent = fmt(foodTotal + containerTotal);
}

function openCart(){el("#cartModal").style.display="flex";}
el("#closeCart").onclick=()=>el("#cartModal").style.display="none";
el("#clear").onclick=()=>{
  cart=[];
  containerQty=0;
  el("#containerQty").textContent=0;
  updateCart();
};

el("#send").onclick=()=>{
  if(cart.length===0){alert("Корзина пуста");return;}
  const name=el("#name").value.trim();
  const phone=el("#phone").value.trim();
  if(!name||!phone){alert("Введите имя и телефон");return;}
  const addr=el("#addr").value.trim();
 const pay = document.querySelector('input[name="pay"]:checked').value;

let msg =
  `Новый заказ в Кафе Алмаз:\n\n` +
  `Имя: ${name}\n` +
  `Телефон: ${phone}\n` +
  (addr ? `Адрес/Примечание: ${addr}\n` : "") +
  `Способ оплаты: ${pay}\n\n` +
  `Заказ:\n`;

  cart.forEach((it,i)=>msg+=`${i+1}. ${it.name} x${it.q} = ${it.price*it.q} ₸\n`);
  if (containerQty > 0) {
  msg += `\nКонтейнеры: ${containerQty} x ${CONTAINER_PRICE} ₸ = ${containerQty * CONTAINER_PRICE} ₸\n`;
}
  msg+=`\nИтого: ${foodTotal + containerQty * CONTAINER_PRICE} ₸`;

  window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
};

renderTabs();
renderMenu();
updateCart();
function showAddedAnimation(btn){
  btn.classList.add('added-to-cart');
  btn.textContent = "Добавлено ✓";
  setTimeout(()=>{
    btn.classList.remove('added-to-cart');
    btn.textContent = "Добавить";
  }, 800);
}

// Модификация функции addToCart:
function addToCart(id){
  const [cat,i] = id.split("_");
  const p = categories[cat][i];
  const ex = cart.find(x=>x.name===p.name);
  if(ex) ex.q++;
  else cart.push({...p,q:1});
  updateCart();

  // Показываем анимацию и обновление корзины
  const btn = event.target;
  showAddedAnimation(btn);

  // Лёгкое масштабирование и вспышка на иконке корзины
  const cartBtn = el("#floatCart");
  cartBtn.style.transform = "scale(1.2)";
  setTimeout(()=>cartBtn.style.transform="scale(1)",200);
}

function searchMenu() {
  const query = el("#searchInput").value.toLowerCase().trim();
  const menu = el("#menu");
  menu.innerHTML = "";

  if (query === "") {
    renderMenu();
    return;
  }

  // Собираем все блюда
  let results = [];
  Object.keys(categories).forEach(cat => {
    categories[cat].forEach((p, i) => {
      if (
        p.name.toLowerCase().includes(query) ||
        (p.desc && p.desc.toLowerCase().includes(query))
      ) {
        results.push({ ...p, cat, i });
      }
    });
  });

  if (results.length === 0) {
    menu.innerHTML = `<p style="text-align:center;color:var(--muted)">Ничего не найдено</p>`;
  } else {
    results.forEach(r => {
      menu.innerHTML += `
        <div class="dish">
          <h3>${r.name}</h3>
          ${r.desc ? `<p>${r.desc}</p>` : ""}
          <div class="price">${fmt(r.price)}</div>
          <button class="btn add-btn" onclick="addToCart('${r.cat}_${r.i}')">Добавить</button>
        </div>`;
    });
  }
}

function changeContainer(d) {
  containerQty += d;
  if (containerQty < 0) containerQty = 0;
  el("#containerQty").textContent = containerQty;
  updateCart();
}


</script>
</body>
</html>
