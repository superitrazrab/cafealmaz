<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Кафе Алмаз — меню и доставка</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f7f1e8;
  --card:#fffaf5;
  --accent:#8b5e3c;
  --accent-light:#c9a77b;
  --text:#2b2318;
  --muted:#7a6a55;
  --shadow:rgba(18,12,8,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Inter",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:16px;
  scroll-behavior:smooth;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.logo{
  width:60px;height:60px;
  border-radius:50%;
  background:url('https://i.ibb.co.com/PqqVYdK/almaz.jpg') center/cover no-repeat;
  box-shadow:0 6px 18px var(--shadow);
}
h1{font-size:20px;}
.brand p{font-size:13px;color:var(--muted)}
.btn{
  background:var(--accent);
  color:white;
  border:0;
  border-radius:10px;
  padding:10px 16px;
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  transition:.15s;
}
.btn:active{transform:scale(0.97);}
.btn.ghost{
  background:transparent;
  border:1px solid rgba(43,35,26,0.1);
  color:var(--accent);
}

/* --- ТАБЫ --- */
.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:20px;
  justify-content:center;
}
.tab{
  padding:10px 16px;
  border-radius:10px;
  background:var(--card);
  border:1px solid rgba(43,35,26,0.1);
  cursor:pointer;
  font-weight:600;
  font-size:15px;
  box-shadow:0 2px 6px var(--shadow);
  transition:.2s;
  text-align:center;
}
.tab:active{transform:scale(0.95);}
.tab.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent-light);
}
@media(max-width:600px){
  .tabs{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  .tab{
    text-align:center;
    font-size:13px;
    padding:10px 6px;
    border-radius:12px;
  }
}

/* --- БЛЮДА --- */
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:16px;
  margin-bottom:60px;
}
.dish{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  box-shadow:0 4px 14px var(--shadow);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:.2s ease;
  position:relative;
}
.dish:hover{transform:translateY(-3px);}
.dish h3{font-size:16px;margin-bottom:4px;}
.dish p{font-size:13px;color:var(--muted);margin-bottom:6px;}
.price{color:var(--accent-light);font-weight:800;font-size:15px;margin-bottom:8px;}
.add-btn{width:100%;}

/* --- FLOAT CART --- */
#floatCart{
  position:fixed;
  bottom:22px;
  right:22px;
  background:var(--accent);
  color:white;
  width:80px;
  height:80px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  cursor:pointer;
  font-weight:800;
  font-size:26px;
  z-index:999;
  transition:transform .2s ease;
}
#floatCart:hover{transform:scale(1.08);}
#floatCart span{
  position:absolute;
  top:10px;
  right:12px;
  background:#fff;
  color:var(--accent);
  border-radius:50%;
  width:25px;
  height:25px;
  font-size:14px;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* --- CART MODAL --- */
#cartModal{
  position:fixed;top:0;left:0;width:100%;height:100%;
  background:rgba(0,0,0,0.4);
  display:none;align-items:center;justify-content:center;
  z-index:1000;
}
.cart-box{
  background:var(--card);
  border-radius:16px;
  padding:18px;
  width:90%;
  max-width:420px;
  box-shadow:0 8px 24px rgba(0,0,0,0.1);
  max-height:90%;
  overflow:auto;
}
.cart-box h3{margin-bottom:10px;text-align:center;}
.cart-item{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{border:1px solid rgba(43,35,26,0.1);background:transparent;border-radius:6px;padding:4px 10px;cursor:pointer;}
.total{
  display:flex;justify-content:space-between;margin-top:8px;
  font-weight:800;border-top:1px dashed rgba(43,35,26,0.1);
  padding-top:8px;
}
form{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
input,textarea{
  border:1px solid rgba(43,35,26,0.1);
  border-radius:10px;
  padding:10px;
  font-size:14px;
  background:transparent;
}
textarea{min-height:60px;resize:vertical;}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px;}

/* --- УВЕДОМЛЕНИЕ --- */
#addedNotify{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:white;
  padding:10px 22px;
  border-radius:12px;
  font-weight:600;
  opacity:0;
  transition:opacity .3s ease;
  z-index:2000;
}
#addedNotify.show{opacity:1;}

</style>



</head>
<body>

  <div class="brand">
    <div class="logo"></div>

<!-- Поисковая строка -->

    id="searchInput"

    placeholder="🔍 Поиск по меню..."

      width:90%;
      max-width:400px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(43,35,26,0.2);

<div class="tabs" id="tabs"></div>

<div style="display:flex; gap:12px; margin-top:4px; margin-bottom:8px;">

      <button id="send" class="btn">Отправить в WhatsApp</button>

</p>

    <button id="closeCart" class="btn ghost" style="margin-top:10px;width:100%">Закрыть</button>
  </div>
</div>

<script>

],

],

],

{name:"Пицца с сёмгой", price:5100}
],
"🍱 СЕТЫ":[
{name:"Сет 1 — 24 шт", price:6600, desc:"Филадельфия, Сэки Темпура, ролл с огурцом, Калифорния"},
{name:"Сет 2 — 32 шт", price:10600, desc:"Запечённый с крабом, Эби Темпура, Филадельфия, Калифорния"},
{name:"Сет 3 — 40 шт", price:12600, desc:"Филадельфия, Дакота, запечённый с креветкой, Гурме, ролл с лососем"},
{name:"Сет 4 — 48 шт", price:16300, desc:"Запечённый с лососем, запечённый с креветкой, Эби Темпура, Сэки Темпура, Калифорния, Филадельфия"}
]

};

let currentCategory = Object.keys(categories)[0];
let cart = [];

const el = s => document.querySelector(s);
const fmt = v => v.toLocaleString('ru-RU') + " ₸";

function renderTabs(){
  const tabs = el("#tabs");
  tabs.innerHTML = "";
  Object.keys(categories).forEach(cat=>{
    const div = document.createElement("div");
    div.className = "tab" + (cat===currentCategory ? " active" : "");
    div.textContent = cat;
    div.onclick = ()=>{currentCategory=cat;renderTabs();renderMenu();};
    tabs.appendChild(div);
  });
}

function renderMenu(){
  const menu = el("#menu");
  menu.innerHTML = "";
  categories[currentCategory].forEach((p,i)=>{
    menu.innerHTML += `
      <div class="dish">
        <h3>${p.name}</h3>
        ${p.desc?`<p>${p.desc}</p>`:""}
        <div class="price">${fmt(p.price)}</div>
        <button class="btn add-btn" onclick="addToCart('${currentCategory}_${i}')">Добавить</button>
      </div>`;
  });
}

function addToCart(id){
  const [cat,i] = id.split("_");
  const p = categories[cat][i];
  const ex = cart.find(x=>x.name===p.name);
  if(ex) ex.q++;
  else cart.push({...p,q:1});
  updateCart();
}

function changeQty(name,d){
  const it = cart.find(x=>x.name===name);
  if(!it)return;
  it.q+=d;
  if(it.q<1)cart=cart.filter(x=>x.name!==name);
  updateCart();
}

function updateCart(){
  el("#cartCount").textContent = cart.reduce((s,x)=>s+x.q,0);
  const l = el("#cartList");
  if(cart.length===0){l.innerHTML="<p style='color:var(--muted);text-align:center'>Корзина пуста</p>";}
  else{
    l.innerHTML = cart.map(it=>`
      <div class="cart-item">
        <div>${it.name}<br><small>${fmt(it.price)}</small></div>
        <div class="qty">
          <button onclick="changeQty('${it.name}',-1)">-</button>
          <div>${it.q}</div>
          <button onclick="changeQty('${it.name}',1)">+</button>
        </div>
      </div>`).join('');
  }
  el("#cartTotal").textContent = fmt(cart.reduce((s,x)=>s+x.price*x.q,0));
}

function openCart(){el("#cartModal").style.display="flex";}
el("#closeCart").onclick=()=>el("#cartModal").style.display="none";
el("#clear").onclick=()=>{cart=[];updateCart();};
el("#send").onclick=()=>{
  if(cart.length===0){alert("Корзина пуста");return;}
  const name=el("#name").value.trim();
  const phone=el("#phone").value.trim();
  if(!name||!phone){alert("Введите имя и телефон");return;}
  const addr=el("#addr").value.trim();
 const pay = document.querySelector('input[name="pay"]:checked').value;

let msg =
  `Новый заказ в Кафе Алмаз:\n\n` +
  `Имя: ${name}\n` +
  `Телефон: ${phone}\n` +
  (addr ? `Адрес/Примечание: ${addr}\n` : "") +
  `Способ оплаты: ${pay}\n\n` +
  `Заказ:\n`;

  cart.forEach((it,i)=>msg+=`${i+1}. ${it.name} x${it.q} = ${it.price*it.q} ₸\n`);
  msg+=`\nИтого: ${cart.reduce((s,x)=>s+x.price*x.q,0)} ₸`;
  window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
};

renderTabs();
renderMenu();
updateCart();
function showAddedAnimation(btn){
  btn.classList.add('added-to-cart');
  btn.textContent = "Добавлено ✓";
  setTimeout(()=>{
    btn.classList.remove('added-to-cart');
    btn.textContent = "Добавить";
  }, 800);
}

// Модификация функции addToCart:
function addToCart(id){
  const [cat,i] = id.split("_");
  const p = categories[cat][i];
  const ex = cart.find(x=>x.name===p.name);
  if(ex) ex.q++;
  else cart.push({...p,q:1});
  updateCart();

  // Показываем анимацию и обновление корзины
  const btn = event.target;
  showAddedAnimation(btn);

  // Лёгкое масштабирование и вспышка на иконке корзины
  const cartBtn = el("#floatCart");
  cartBtn.style.transform = "scale(1.2)";
  setTimeout(()=>cartBtn.style.transform="scale(1)",200);
}

function searchMenu() {
  const query = el("#searchInput").value.toLowerCase().trim();
  const menu = el("#menu");
  menu.innerHTML = "";

  if (query === "") {
    renderMenu();
    return;
  }

  // Собираем все блюда
  let results = [];
  Object.keys(categories).forEach(cat => {
    categories[cat].forEach((p, i) => {
      if (
        p.name.toLowerCase().includes(query) ||
        (p.desc && p.desc.toLowerCase().includes(query))
      ) {
        results.push({ ...p, cat, i });
      }
    });
  });

  if (results.length === 0) {
    menu.innerHTML = `<p style="text-align:center;color:var(--muted)">Ничего не найдено</p>`;
  } else {
    results.forEach(r => {
      menu.innerHTML += `
        <div class="dish">
          <h3>${r.name}</h3>
          ${r.desc ? `<p>${r.desc}</p>` : ""}
          <div class="price">${fmt(r.price)}</div>
          <button class="btn add-btn" onclick="addToCart('${r.cat}_${r.i}')">Добавить</button>
        </div>`;
    });
  }
}


</script>
</body>
</html>
